<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestellung Abgebrochen - 3dSwissDesign</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 48px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .cancel-icon {
      width: 80px;
      height: 80px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .cancel-icon svg {
      width: 40px;
      height: 40px;
      color: #dc2626;
    }
    h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    p {
      color: #666;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #5a7fa8;
      color: white;
    }
    .btn-primary:hover {
      background: #7a9fc8;
    }
    .btn-secondary {
      background: #f5f0e8;
      color: #1a1a1a;
    }
    .btn-secondary:hover {
      background: #e5e0d8;
    }
    .logo {
      width: 120px;
      margin-bottom: 32px;
    }
    .help-text {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #eee;
      font-size: 14px;
      color: #999;
    }
    .help-text a {
      color: #5a7fa8;
      text-decoration: none;
    }
    .help-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.jpg" alt="3dSwissDesign" class="logo">
    
    <div class="cancel-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>
    
    <h1>Zahlung Abgebrochen</h1>
    <p>Ihre Zahlung wurde abgebrochen. Keine Sorge, Ihr Warenkorb wurde gespeichert und Sie können die Bestellung jederzeit abschliessen.</p>
    
    <div class="buttons">
      <a href="/" class="btn btn-primary">Zurück zum Warenkorb</a>
      <a href="/" class="btn btn-secondary">Weiter einkaufen</a>
    </div>
    
    <div class="help-text">
      Haben Sie Fragen? <a href="mailto:info@3dswissdesign.com">Kontaktieren Sie uns</a>
    </div>
  </div>
</body>
</html>
